name: Actualizar noticias

on:
  schedule:
    - cron: '10 5 * * *'   # 07:10 GMT+2
    - cron: '10 12 * * *'  # 14:10 GMT+2
    - cron: '10 19 * * *'  # 21:10 GMT+2
  workflow_dispatch:        # permite ejecución manual desde GitHub Actions UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cache sesión Instagram
        uses: actions/cache@v4
        with:
          path: data/instagram_sessions
          key: instagram-session-${{ secrets.INSTAGRAM_USERNAME }}-v1

      - name: Ejecutar pipeline
        timeout-minutes: 70
        env:
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
        run: python scripts/run_all.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "HandbolNoticias Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/articles.db sitemap.xml -f
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos"
          else
            git commit -m "Actualización diaria $(date -u +%Y-%m-%d)"
            # docs/ y data/articles.db son 100% contenido generado: si alguien
            # pusheó mientras corría el pipeline, un rebase normal choca en
            # cientos de archivos derivados. En vez de fallar, resolvemos
            # quedándonos con la versión de origin en lo generado (ya incluye
            # cualquier fix manual aplicado mientras tanto) y reintentamos el
            # push con el commit de este run encima.
            if ! git push; then
              git fetch origin main
              if ! git merge origin/main --no-edit; then
                git checkout --theirs -- data/articles.db docs/ sitemap.xml
                git add data/articles.db docs/ sitemap.xml
                git commit --no-edit
              fi
              git push
            fi
          fi

      - name: Checkpoint diario
        run: |
          TAG="checkpoint-$(date -u +%Y-%m-%d)"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "Checkpoint $TAG ya existe"
          else
            git tag -a "$TAG" -m "Checkpoint automático diario"
            git push origin "$TAG"
          fi
